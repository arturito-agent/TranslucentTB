<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic browser fixture</title>
<style>
  * { box-sizing: border-box; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { margin: 0; background: rgb(248,248,248); font: 16px system-ui,sans-serif; }
  section { height: 100vh; display: grid; place-items: center; }
  section:nth-child(1) { background: rgb(248,248,248); color: #111; }
  section:nth-child(2) { background: rgb(16,16,16); color: #fff; }
  section:nth-child(3) { background: rgb(32,96,160); color: #fff; }
  section:nth-child(4) { background: rgb(240,0,0); color: #000; }
  aside { position: fixed; z-index: 2; top: 32px; left: 50%; transform: translateX(-50%);
    width: min(430px,70vw); background: #fff; color: #111; padding: 16px;
    border: 1px solid #444; border-radius: 8px; }
  button { margin: 3px; padding: 7px 12px; cursor: pointer; }
  output { display: block; margin-top: 10px; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; }
  [hidden] { display: none !important; }
  body.theme-mode section, body.video-mode section { visibility: hidden; }
</style>
<aside aria-label="Synthetic fixture controls">
  <strong>Dynamic browser fixture</strong>
  <p>Offline synthetic content. Keep the same app window focused.</p>
  <button id="scroll">Scroll</button>
  <button id="theme">Change theme</button>
  <button id="video">Play video</button>
  <button id="cycle">Start scroll cycle</button>
  <button id="stop">Stop cycle</button>
  <output id="status" aria-live="polite">Scroll: light 248,248,248</output>
</aside>
<main>
  <section>Light — RGB 248,248,248</section>
  <section>Dark — RGB 16,16,16</section>
  <section>Blue — RGB 32,96,160</section>
  <section>Red — RGB 240,0,0</section>
</main>
<video id="player" src="dynamic-video.webm" preload="none" muted loop playsinline hidden></video>
<script>
  'use strict';
  const status = document.getElementById('status');
  const player = document.getElementById('player');
  const colors = ['248,248,248','16,16,16','32,96,160','240,0,0'];
  let page = 0;
  let dark = false;
  let cycle = null;
  function stopCycle() { clearInterval(cycle); cycle = null; }
  function showScroll() {
    player.pause();
    player.hidden = true;
    document.body.className = '';
    window.scrollTo({ top: page * innerHeight, behavior: 'instant' });
    status.textContent = 'Scroll: RGB ' + colors[page];
  }
  document.getElementById('scroll').addEventListener('click', () => {
    stopCycle();
    page = (page + 1) % colors.length;
    showScroll();
  });
  document.getElementById('theme').addEventListener('click', () => {
    stopCycle();
    player.pause();
    player.hidden = true;
    document.body.className = 'theme-mode';
    dark = !dark;
    document.body.style.background = dark ? 'rgb(16,16,16)' : 'rgb(248,248,248)';
    status.textContent = 'Theme: RGB ' + (dark ? colors[1] : colors[0]);
  });
  document.getElementById('cycle').addEventListener('click', () => {
    stopCycle();
    page = 0;
    showScroll();
    cycle = setInterval(() => { page = (page + 1) % colors.length; showScroll(); }, 3500);
  });
  document.getElementById('stop').addEventListener('click', stopCycle);
  document.getElementById('video').addEventListener('click', async () => {
    stopCycle();
    document.body.className = 'video-mode';
    player.hidden = false;
    try {
      await player.play();
      status.textContent = 'Video: decoded colors may differ from source RGB.';
    } catch (error) {
      player.hidden = true;
      status.textContent = 'Video unavailable: ' + error.message;
    }
  });
  player.addEventListener('error', () => {
    status.textContent = 'Video unavailable: place dynamic-video.webm beside this HTML file.';
  });
  addEventListener('resize', () => { if (!document.body.className) showScroll(); });
</script>
</html>
